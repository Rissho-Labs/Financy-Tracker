<!DOCTYPE html>
<html lang="pt-BR" class="ft-cards ft-ios">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="/shared/js/ft-tab-nav-boot.js"></script>
  <meta name="theme-color" content="#0c0c0e" />
  <meta name="description" content="Finance Tracker — Cartões de Crédito." />
  <title>Finance Tracker — Cartões</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/global.css" />
  <link rel="stylesheet" href="/shared/css/ft-sheet-layout.css" />
  <link rel="stylesheet" href="/features/transactions/home.css" />
  <link rel="stylesheet" href="/shared/css/ft-tab-carousel.css" />
  <link rel="stylesheet" href="/features/cards/cards.css" />
  <link rel="stylesheet" href="/features/goals/goals.css" />
  <link rel="stylesheet" href="/features/transactions/transactions.css" />
  <script src="/core/ft-secure-console.js"></script>
  <script src="/core/ft-theme.js"></script>
  <script src="/core/ft-build.js"></script>
  <script src="/core/ft-storage.js"></script>
  <script src="/core/ft-routes.js"></script>
</head>
<body>

  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2 cards-blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="phone-frame" role="main" id="app">

    <div class="status-bar" aria-hidden="true">
      <span class="status-time" id="status-clock">12:00</span>
      <div class="status-icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="4" width="3" height="7" rx="1" fill="white" opacity="0.4"/><rect x="4.5" y="2.5" width="3" height="8.5" rx="1" fill="white" opacity="0.6"/><rect x="9" y="0.5" width="3" height="10.5" rx="1" fill="white"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="2" fill="white"/></svg>
      </div>
    </div>
    <div class="dynamic-island" aria-hidden="true"></div>

    <header class="home-header">
      <div class="header-left">
        <h1 class="user-name cards-header-title">Cartões</h1>
      </div>
      <div class="header-right cards-header-actions">
        <button type="button" class="add-card-btn-top" aria-label="Adicionar Cartão">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button type="button" class="notification-btn" id="notification-btn" aria-label="Avisos">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
        </button>
      </div>
    </header>

    <div class="home-scroll">
      
      <!-- ── CARDS CAROUSEL SECTION ──────────────────────────── -->
      <section class="cards-display-section">
        
        <div class="carousel-container" id="cc-carousel">
          <div class="cards-track" id="cc-track" role="list"></div>
        </div>

        <div class="card-dots cards-dots hidden" id="cc-dots" aria-hidden="true"></div>

        <div class="cards-empty-state" id="cc-empty-state">
          <p class="cards-empty-text">Nenhum cartão cadastrado ainda.</p>
          <button type="button" class="tx-add-btn cards-empty-btn" id="cc-add-first-btn">Cadastrar primeiro cartão</button>
        </div>

        <div class="cc-bento" id="cc-details-wrap">
          <div class="cc-details-container">
            <div class="cc-details">
              <p class="cc-label">Fatura atual</p>
              <h2 class="cc-amount" id="cc-invoice-amount">R$ 0,00</h2>
              <div class="cc-limit-wrap">
                <div class="cc-limit-text">
                  <span>Limite disponível</span>
                  <span class="cc-limit-val" id="cc-limit-available">—</span>
                </div>
                <div class="cc-limit-bar-bg">
                  <div class="cc-limit-bar-fill" id="cc-limit-fill"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="cc-dates" role="group" aria-label="Datas da fatura">
            <div class="cc-date-box">
              <span class="cc-date-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </span>
              <div>
                <span class="cc-date-lbl">Fechamento</span>
                <span class="cc-date-val" id="cc-close-date-val">—</span>
              </div>
            </div>
            <div class="cc-date-box">
              <span class="cc-date-icon cc-date-icon--warning" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </span>
              <div>
                <span class="cc-date-lbl">Vencimento</span>
                <span class="cc-date-val" id="cc-due-date-val">—</span>
              </div>
            </div>
          </div>
        </div>

      </section>

      <!-- ── CARD TRANSACTIONS ──────────────────────────────── -->
      <section class="transactions-section">
        <div class="section-title-row">
          <h2 class="section-title">Lançamentos da Fatura</h2>
        </div>

        <ul class="tx-list hidden" id="cc-tx-list" role="list"></ul>
        <p class="tx-empty" id="cc-tx-empty">Nenhum lançamento nesta fatura.</p>
      </section>

      <div class="cards-scroll-spacer"></div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item" aria-label="Início" id="nav-home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Início</span>
      </button>
      <button class="nav-item active" aria-label="Cartões" aria-current="page" id="nav-wallet">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
        <span>Cartões</span>
        <div class="nav-indicator" aria-hidden="true"></div>
      </button>
      <button class="nav-item" aria-label="Metas" id="nav-tx">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span>Metas</span>
      </button>
      <button class="nav-item" aria-label="Perfil" id="nav-profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Perfil</span>
      </button>
    </nav>

    <div id="add-card-modal" class="ft-sheet" aria-hidden="true">
      <div class="ft-sheet__backdrop"></div>
      <div class="ft-sheet__panel ft-form-sheet" role="dialog" aria-labelledby="add-card-title">
        <div class="ft-sheet__handle" aria-hidden="true"></div>
        <h2 id="add-card-title" class="ft-sheet__title">Novo cartão</h2>
        <label class="field-label">Nome no cartão</label>
        <input id="cc-add-name" type="text" class="ft-form-input" maxlength="48" />
        <label class="field-label">Final do número (4 dígitos)</label>
        <input id="cc-add-last4" type="text" class="ft-form-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" />
        <label class="field-label">Bandeira</label>
        <select id="cc-add-brand" class="ft-form-input ft-form-select">
          <option value="visa">Visa</option>
          <option value="master">Mastercard</option>
          <option value="elo">Elo</option>
          <option value="amex">American Express</option>
          <option value="other">Outra</option>
        </select>
        <div id="cc-add-brand-other-wrap" class="cc-form-field hidden">
          <label class="field-label" for="cc-add-brand-other">Nome da bandeira</label>
          <input id="cc-add-brand-other" type="text" class="ft-form-input" maxlength="20" placeholder="Ex: Hipercard" autocomplete="off" />
        </div>
        <div class="cc-form-row2">
          <div class="cc-form-field">
            <label class="field-label" for="cc-add-close-day">Fechamento da fatura</label>
            <input id="cc-add-close-day" type="text" class="ft-form-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="Ex: 15" aria-describedby="cc-add-close-hint" autocomplete="off" />
            <span class="cc-field-hint" id="cc-add-close-hint">Dia do mês (1–31)</span>
          </div>
          <div class="cc-form-field">
            <label class="field-label" for="cc-add-due-day">Vencimento</label>
            <input id="cc-add-due-day" type="text" class="ft-form-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="Ex: 22" aria-describedby="cc-add-due-hint" autocomplete="off" />
            <span class="cc-field-hint" id="cc-add-due-hint">Dia do mês (1–31)</span>
          </div>
        </div>
        <button type="button" class="goal-submit" id="cc-add-save">Adicionar</button>
        <button type="button" class="ft-sheet__close ft-form-cancel" id="cc-add-cancel">Cancelar</button>
      </div>
    </div>

  </div>

  <script src="/core/ft-session.js"></script>
  <script src="/features/cards/ft-cards.js"></script>
  <script src="/features/cards/ft-card-brands.js"></script>
  <script src="/features/transactions/ft-transactions.js"></script>
  <script src="/shared/js/notification-panel.js"></script>
  <script src="/shared/js/ft-tab-carousel.js"></script>
  <script src="/shared/js/ft-bottom-nav.js"></script>
  <script src="/features/cards/cards.js"></script>
</body>
</html>
