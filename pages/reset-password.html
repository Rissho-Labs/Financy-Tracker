<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Finance Tracker — Nova senha</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/register.css" />
  <script src="../assets/js/ft-theme.js"></script>
</head>
<body>

  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="phone-frame" role="main">
    <div class="dynamic-island" aria-hidden="true"></div>

    <!-- Top bar -->
    <div class="register-topbar">
      <a href="../index.html" class="back-btn" aria-label="Voltar para login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <span class="topbar-title">Nova senha</span>
      <div style="width:32px"></div>
    </div>

    <div class="card-scroll">
      <div class="card register-card">

        <!-- Loading state (verificando código) -->
        <div id="rp-loading" class="rp-state">
          <div class="rp-spinner-wrap" aria-hidden="true">
            <div class="btn-spinner rp-spinner-lg"></div>
          </div>
          <p class="rp-loading-text">Verificando link...</p>
        </div>

        <!-- Erro: link inválido/expirado -->
        <div id="rp-invalid" class="rp-state rp-state--hidden">
          <div class="rp-error-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <h2 class="card-title" style="text-align:center;font-size:20px">Link inválido</h2>
          <p class="card-subtitle" id="rp-invalid-msg" style="text-align:center;margin-top:8px">
            Este link expirou ou já foi usado. Solicite um novo.
          </p>
          <a href="../index.html" class="btn btn-primary rp-btn-full" style="text-decoration:none;display:flex;align-items:center;justify-content:center;margin-top:24px">
            Voltar para o login
          </a>
        </div>

        <!-- Formulário de nova senha -->
        <div id="rp-form-wrap" class="rp-state rp-state--hidden">
          <div class="card-header" style="padding-bottom:16px">
            <div class="rp-lock-icon" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                <circle cx="12" cy="16" r="1" fill="currentColor"/>
              </svg>
            </div>
            <h1 class="card-title">Criar nova senha</h1>
            <p class="card-subtitle">
              <span class="dot" aria-hidden="true">●</span>
              <span id="rp-email-label">Definindo nova senha para sua conta</span>
            </p>
          </div>

          <form id="rp-form" novalidate>
            <!-- Nova senha -->
            <div class="field-group">
              <label class="field-label" for="rp-password">Nova senha</label>
              <div class="field-wrapper">
                <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input id="rp-password" type="password" class="field-input" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required />
                <button type="button" id="rp-toggle-pw" class="eye-btn" aria-label="Mostrar senha">
                  <svg id="rp-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <!-- indicador de força -->
              <div class="strength-bars" id="rp-strength-bars" aria-hidden="true">
                <div class="strength-bar" id="rp-sbar-1"></div>
                <div class="strength-bar" id="rp-sbar-2"></div>
                <div class="strength-bar" id="rp-sbar-3"></div>
                <div class="strength-bar" id="rp-sbar-4"></div>
                <span class="strength-label" id="rp-strength-label"></span>
              </div>
              <span class="field-error" id="rp-pw-error" role="alert" aria-live="polite"></span>
            </div>

            <!-- Confirmar senha -->
            <div class="field-group">
              <label class="field-label" for="rp-confirm">Confirmar nova senha</label>
              <div class="field-wrapper">
                <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input id="rp-confirm" type="password" class="field-input" placeholder="Repita a senha" autocomplete="new-password" required />
                <button type="button" id="rp-toggle-cf" class="eye-btn" aria-label="Mostrar confirmação">
                  <svg id="rp-eye-cf" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <span class="field-error" id="rp-cf-error" role="alert" aria-live="polite"></span>
            </div>

            <button id="rp-btn-submit" type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">
              <span class="btn-text">Salvar nova senha</span>
              <div class="btn-spinner" aria-hidden="true"></div>
            </button>
          </form>
        </div>

        <!-- Sucesso -->
        <div id="rp-success" class="rp-state rp-state--hidden">
          <div class="rp-success-icon" aria-hidden="true">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
          <h2 class="card-title" style="text-align:center;font-size:20px">Senha atualizada!</h2>
          <p class="card-subtitle" style="text-align:center;margin-top:8px">
            Sua nova senha foi salva. Agora você pode fazer login normalmente.
          </p>
          <a href="../index.html" id="rp-btn-login" class="btn btn-primary rp-btn-full" style="text-decoration:none;display:flex;align-items:center;justify-content:center;margin-top:24px">
            Ir para o login
          </a>
        </div>

        <div class="safe-area-bottom" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/ft-firebase.bundle.js"></script>
  <script src="../assets/js/ft-session.js"></script>
  <script src="../assets/js/reset-password.js"></script>
</body>
</html>
