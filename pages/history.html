<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Finance Tracker — Histórico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/home.css" />
  <link rel="stylesheet" href="../assets/css/transactions.css" />
  <link rel="stylesheet" href="../assets/css/receipt-report.css" />
  <script src="../assets/js/ft-theme.js"></script>
  <script src="../assets/js/ft-build.js"></script>
  <script src="../assets/js/ft-storage.js"></script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="phone-frame" role="main" id="app">
    <div class="status-bar" aria-hidden="true">
      <span class="status-time" id="status-clock">12:00</span>
      <div class="status-icons">
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="2" fill="white"/></svg>
      </div>
    </div>
    <div class="dynamic-island" aria-hidden="true"></div>

    <header class="home-header" style="border:none;background:transparent;">
      <div class="header-left">
        <button type="button" class="ob-nav-back hist-back" onclick="window.location.href='home.html'" aria-label="Voltar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1 class="user-name hist-page-title">Histórico</h1>
      </div>
    </header>

    <div class="home-scroll">
      <section class="hist-filters" aria-label="Filtros">
        <div class="hist-filter-group">
          <span class="hist-filter-label">Período</span>
          <div class="hist-seg" role="tablist">
            <button type="button" class="hist-seg-btn active" id="hist-period-month" role="tab" aria-selected="true">Mês</button>
            <button type="button" class="hist-seg-btn" id="hist-period-custom" role="tab" aria-selected="false">Intervalo</button>
          </div>
        </div>
        <div class="hist-period-panel" id="hist-panel-month">
          <label class="hist-sr-only" for="hist-month-input">Mês</label>
          <input type="month" id="hist-month-input" class="hist-month-input" />
        </div>
        <div class="hist-period-panel hidden" id="hist-panel-custom">
          <div class="hist-date-pair">
            <div class="hist-field">
              <label for="hist-date-from">De</label>
              <input type="date" id="hist-date-from" class="hist-date-input" />
            </div>
            <div class="hist-field">
              <label for="hist-date-to">Até</label>
              <input type="date" id="hist-date-to" class="hist-date-input" />
            </div>
          </div>
        </div>

        <div class="hist-filter-group">
          <span class="hist-filter-label">Pagamento</span>
          <div class="hist-pay-chips" id="hist-pay-chips" role="group" aria-label="Forma de pagamento">
            <button type="button" class="hist-chip active" data-pay="all">Todos</button>
            <button type="button" class="hist-chip" data-pay="pix">Pix</button>
            <button type="button" class="hist-chip" data-pay="dinheiro">Dinheiro</button>
            <button type="button" class="hist-chip" data-pay="debito">Débito</button>
            <button type="button" class="hist-chip" data-pay="credito">Crédito</button>
            <button type="button" class="hist-chip" data-pay="credito_parcelado">Parcelado</button>
          </div>
        </div>
      </section>

      <p class="hist-summary" id="hist-summary" aria-live="polite"></p>
      <p class="hist-hold-hint">Segure um gasto para abrir o relatório</p>

      <ul class="hist-list" id="hist-list" role="list"></ul>
      <p class="hist-empty hidden" id="hist-empty">Nenhuma transação neste filtro.</p>

      <div style="height:24px" aria-hidden="true"></div>
    </div>
  </div>

  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/ft-firebase.bundle.js"></script>
  <script src="../assets/js/ft-session.js"></script>
  <script src="../assets/js/ft-transactions.js"></script>
  <script src="../assets/js/ft-receipt-report.js"></script>
  <script src="../assets/js/history.js"></script>
</body>
</html>
