<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Finance Tracker — Metas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/home.css" />
  <link rel="stylesheet" href="../assets/css/goals.css" />
  <script src="../assets/js/ft-theme.js"></script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="phone-frame" role="main" id="app">
    <div class="status-bar" aria-hidden="true">
      <span class="status-time" id="status-clock">12:00</span>
      <div class="status-icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="4" width="3" height="7" rx="1" fill="white" opacity="0.4"/><rect x="4.5" y="2.5" width="3" height="8.5" rx="1" fill="white" opacity="0.6"/><rect x="9" y="0.5" width="3" height="10.5" rx="1" fill="white"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="2" fill="white"/></svg>
      </div>
    </div>
    <div class="dynamic-island" aria-hidden="true"></div>

    <header class="home-header" style="border-bottom:none;background:transparent;">
      <div class="header-left">
        <h1 class="user-name" style="font-size:26px;">Metas</h1>
      </div>
      <div class="header-right">
        <button type="button" class="notification-btn" id="notification-btn" aria-label="Avisos">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-badge">2</span>
        </button>
      </div>
    </header>

    <div class="home-scroll">
      <p class="goals-intro">Objetivos definidos no início e novos que você criar. Edite valores e datas quando precisar.</p>

      <section class="goal-new-card" aria-label="Nova meta">
        <h3>Nova meta</h3>
        <form id="goal-add-form">
          <div class="tx-field"><label for="g-name">Nome</label><input id="g-name" required maxlength="80" placeholder="Ex.: Reserva de emergência" /></div>
          <div class="tx-field"><label for="g-val">Valor alvo (R$)</label><input id="g-val" inputmode="decimal" required placeholder="0,00" /></div>
          <div class="goal-row2">
            <div class="tx-field"><label for="g-start">Início</label><input id="g-start" type="date" required /></div>
            <div class="tx-field"><label for="g-end">Conclusão</label><input id="g-end" type="date" required /></div>
          </div>
          <button type="submit" class="goal-submit">Incluir meta</button>
        </form>
      </section>

      <section id="goals-list-section" aria-label="Suas metas"></section>

      <div style="height:90px" aria-hidden="true"></div>
    </div>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button type="button" class="nav-item" aria-label="Início" onclick="window.location.href='home.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9L12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Início</span>
      </button>
      <button type="button" class="nav-item" aria-label="Cartões" onclick="window.location.href='cards.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
        <span>Cartões</span>
      </button>
      <button type="button" class="nav-item active" aria-current="page" aria-label="Metas" onclick="window.location.href='goals.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span>Metas</span>
        <div class="nav-indicator" aria-hidden="true"></div>
      </button>
      <button type="button" class="nav-item" aria-label="Perfil" onclick="window.location.href='profile.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Perfil</span>
      </button>
    </nav>

    <div id="goal-edit-root"></div>
  </div>

  <script src="../assets/js/ft-session.js"></script>
  <script src="../assets/js/ft-goals.js"></script>
  <script src="../assets/js/notification-panel.js"></script>
  <script src="../assets/js/goals.js"></script>
</body>
</html>
